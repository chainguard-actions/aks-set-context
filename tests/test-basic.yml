name: Test basic usage with required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          resource-group: my-resource-group
          cluster-name: my-aks-cluster
          subscription: 00000000-0000-0000-0000-000000000000
          admin: false
          use-kubelogin: false
          public-fqdn: false
          resource-type: Microsoft.ContainerService/managedClusters

      - name: Assert action ran (expected to fail without real Azure credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # Without real Azure credentials the action will fail — that is expected.
          # What we verify is that the action was invoked and produced an outcome
          # (either 'success' or 'failure'), not that it was skipped or cancelled.
          if [ "$OUTCOME" = "skipped" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was $OUTCOME — it should have been invoked"
            exit 1
          fi
          echo "PASS: action was invoked (outcome=$OUTCOME)"
