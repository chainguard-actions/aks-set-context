name: Test basic AKS set context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          resource-group: my-resource-group
          cluster-name: my-aks-cluster
          subscription: my-subscription-id
          admin: "false"
          use-kubelogin: "false"
          public-fqdn: "false"
        continue-on-error: true
      - name: Assert action was invoked
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action will fail without real Azure credentials,
          # but we verify it was invoked (not skipped) and inputs were accepted.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran (outcome: ${{ steps.action.outcome }})"
