name: Test basic usage - AKS set context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Attempt AKS set context (expect failure without Azure credentials)
        id: action
        uses: .
        with:
          resource-group: my-resource-group
          cluster-name: my-aks-cluster
          subscription: 00000000-0000-0000-0000-000000000000
          admin: false
          use-kubelogin: false
          public-fqdn: false
          resource-type: Microsoft.ContainerService/managedClusters
        continue-on-error: true
      - name: Assert action ran (expected to fail without real Azure credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action executed with outcome=$OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
