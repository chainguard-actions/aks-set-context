name: Test basic usage with required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          resource-group: my-resource-group
          cluster-name: my-aks-cluster
          subscription: my-subscription-id
          admin: "false"
          use-kubelogin: "false"
          public-fqdn: "false"
        continue-on-error: true
      - name: Assert action ran (expected to fail without Azure credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME, expected failure without Azure credentials)"
