name: Test basic AKS set context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          resource-group: my-resource-group
          cluster-name: my-aks-cluster
          subscription: my-subscription-id
          admin: false
          use-kubelogin: false
          public-fqdn: false
          resource-type: Microsoft.ContainerService/managedClusters
        continue-on-error: true
      - name: Assert action ran (credentials not available in test environment)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action executed (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
