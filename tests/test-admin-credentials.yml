name: Test AKS set context with admin credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          resource-group: my-resource-group
          cluster-name: my-aks-cluster
          admin: "true"
        continue-on-error: true
      - name: Assert action ran with admin input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action requires Azure credentials which are not available in this test.
          # We verify the action was invoked (not skipped) and that it either
          # succeeded or failed due to missing Azure credentials (not due to missing inputs).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with resource-group, cluster-name, and admin inputs"
